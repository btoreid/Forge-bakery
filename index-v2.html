<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Forge Bakery</title>
  <!-- V2 er flyttet til index.html. Denne fila blir stående som videresending,
       fordi to ting fortsatt peker hit: bokmerker på telefonen, og Supabase-
       lenkene i bekreftelses- og passord-e-poster. Fragmentet (#access_token=…)
       må følge med — det er DER innloggingsnøkkelen ligger etter en e-postlenke,
       og et vanlig <meta refresh> ville kastet den. -->
  <script>
    location.replace('./' + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=./">
  <style>
    body { font-family: system-ui, sans-serif; background: #f5ead8; color: #3c3427;
           display: grid; place-items: center; height: 100vh; margin: 0; text-align: center; }
    a { color: #8f4a20; }
  </style>
</head>
<body>
  <p>Forge Bakery har flyttet hit: <a href="./">btoreid.github.io/Forge-bakery/</a></p>
</body>
</html>
