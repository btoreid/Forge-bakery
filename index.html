<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Forge Bakery</title>
  <!-- Installerbar app på Android: manifest + service worker + HTTPS er de tre
       kravene Chrome stiller. theme-color farger systemlinjene i standalone. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5ead8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forge Bakery">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
  <link rel="icon" href="icons/icon-192-v2.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style-v2.css">
</head>
<body>
  <div id="telefon">
    <div class="topp" id="topp"></div>
    <div class="innhold" id="innhold"></div>
    <div class="bunnlinje" id="bunnlinje"></div>
    <nav class="bunnmeny" id="bunnmeny"></nav>
  </div>

  <!-- supabase-js er vendoret lokalt (som fontene): CDN-er er ikke garantert
       tilgjengelige, og appen skal virke fra file:// også. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/app-v2.js"></script>
  <script>
    // Registreres etter load, så den aldri konkurrerer med appens egen oppstart.
    // Relativ sti er nødvendig: appen ligger under /Forge-bakery/, og '/sw.js'
    // ville pekt på domenerota og gitt 404 + feil scope.
    if ('serviceWorker' in navigator) {
      var byttet = false;
      // Byttes worker mens siden står åpen, kjører fanen kanskje halvgammel kode.
      // Last om ÉN gang. Vakten på `controller` er nødvendig: ved aller første
      // installasjon går den fra ingen til én worker, og uten vakten ville hver
      // førstegangsbruker fått en unødig omlasting.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!navigator.serviceWorker.controller || byttet) return;
        byttet = true;
        location.reload();
      });
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
          // Installert app byttes bare til, den lastes sjelden på nytt. Se etter
          // ny versjon hver gang den hentes fram, ellers kunne den blitt stående
          // på gammel kode til brukeren tilfeldigvis refresher.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
